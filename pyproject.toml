[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titans-flax"
version = "0.1.0"
description = "Titans: Learning to Memorize at Test Time - Flax NNX Implementation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mahdi Shafiei" }]
keywords = ["deep-learning", "transformers", "memory", "jax", "flax", "attention", "sequence-modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core JAX ecosystem
    "jax>=0.6.1",
    "jaxlib>=0.6.1",
    "flax>=0.12.0",
    "optax>=0.1.7",

    # Array and scientific computing
    "numpy>=1.26.0",
    "scipy>=1.10.0",

    # Checkpointing and serialization
    "orbax-checkpoint>=0.11.10",

    # JAX ecosystem utilities (auto-installed dependencies made explicit)
    "chex>=0.1.89",
    "ml_dtypes>=0.5.3",
    "opt_einsum>=3.4.0",
    "absl-py>=2.3.0",

    # Utilities
    "tqdm>=4.66.0",
    "rich>=13.0.0",

    # Configuration and data handling
    "pydantic>=2.0.0",
    "pyyaml>=6.0",

    # Tokenization
    "tiktoken>=0.9.0",

    # Plotting and visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.12.0",

    # Logging and experiment tracking
    "wandb>=0.19.0",

    # Development tools
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pyink>=24.3.0",     # Google's version of Black
    "pylint>=3.0.0",     # Google's recommended linter
    "isort>=5.12.0",
    "mypy>=1.11.0",
    "pre-commit>=4.3.0",
    "ruff>=0.1.11",
    "pyright>=1.1.401",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-xdist>=3.6",
    "pyink>=24.3.0",     # Google's version of Black
    "pylint>=3.0.0",     # Google's recommended linter
    "isort>=5.12.0",
    "mypy>=1.11.0",
    "pre-commit>=4.3.0",
    "ruff>=0.1.11",
    "pyright>=1.1.401",
]

research = ["tensorboard>=2.15.0", "jupyter>=1.0.0", "ipykernel>=6.25.0", "notebook>=7.0.0"]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-autorefs>=0.5.0",
    "mike>=2.0.0",
    "mkdocs-awesome-pages-plugin>=2.10.0",
]

gpu = [ # GPU dependencies - CUDA 12 support
    "jax[cuda12]>=0.6.1",
    "jaxlib>=0.6.1",
]

tpu = [ # TPU dependencies
    "jax[tpu]>=0.6.1",
    "jaxlib>=0.6.1",
]

all = ["titans-flax[dev,research,gpu,docs]"]

[project.urls]
Homepage = "https://github.com/mahdi-shafiei/titans-flax"
Documentation = "https://titans-flax.readthedocs.io"
Repository = "https://github.com/mahdi-shafiei/titans-flax"
"Bug Tracker" = "https://github.com/mahdi-shafiei/titans-flax/issues"

[project.scripts]
titans-demo = "examples.titans_complete_example:main"
titans-benchmark = "titans.benchmark:run_full_benchmark"
titans-train = "titans.training:training_example"

[tool.hatch.version]
path = "titans/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["titans"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=titans",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks tests as integration tests",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["titans"]
omit = ["*/tests/*", "*/test_*.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pyink]
line-length = 88
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
# Google style preferences (standard 4-space indentation)
pyink-use-majority-quotes = true

[tool.pylint.main]
load-plugins = [
    "pylint.extensions.check_elif",
    "pylint.extensions.bad_builtin",
    "pylint.extensions.docparams",
    "pylint.extensions.for_any_all",
    "pylint.extensions.set_membership",
    "pylint.extensions.code_style",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.typing",
    "pylint.extensions.redefined_variable_type",
    "pylint.extensions.comparison_placement",
]

[tool.pylint.messages_control]
confidence = ["HIGH", "CONTROL_FLOW", "INFERENCE", "INFERENCE_FAILURE", "UNDEFINED"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    # Google style allows these
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
]

[tool.pylint.format]
max-line-length = 88
max-module-lines = 1000
indent-string = "    "  # Use 4 spaces for standard Python indentation

[tool.pylint.basic]
# Google naming conventions
good-names = ["i", "j", "k", "ex", "Run", "_", "id"]
bad-names = ["foo", "bar", "baz", "toto", "tutu", "tata"]
class-naming-style = "PascalCase"
function-naming-style = "snake_case"
method-naming-style = "snake_case"
module-naming-style = "snake_case"
variable-naming-style = "snake_case"
const-naming-style = "UPPER_CASE"

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-bool-expr = 5
max-branches = 15
max-locals = 20
max-parents = 7
max-public-methods = 25
max-returns = 6
max-statements = 60
min-public-methods = 1

[tool.pylint.imports]
# Enforce absolute imports as per Google style guide
allow-wildcard-with-all = false
analyse-fallback-blocks = false
deprecated-modules = ["optparse", "tkinter.tix"]

[tool.pylint.exceptions]
overgeneral-exceptions = ["builtins.BaseException", "builtins.Exception"]

[tool.pylint.logging]
logging-format-style = "new"

[tool.pylint.miscellaneous]
notes = ["FIXME", "XXX", "TODO"]

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
min-similarity-lines = 4

[tool.pylint.spelling]
max-spelling-suggestions = 4
spelling-ignore-comment-directives = "fmt: off,fmt: on,noqa:,noqa,nosec,isort:skip,mypy:"

[tool.pylint.string]
check-str-concat-over-line-jumps = true

[tool.pylint.typecheck]
contextmanager-decorators = ["contextlib.contextmanager"]
ignore-none = true
ignore-on-opaque-inference = true
ignored-checks-for-mixins = [
    "no-member",
    "not-async-context-manager",
    "not-context-manager",
    "attribute-defined-outside-init",
]
ignored-classes = ["optparse.Values", "thread._local", "_thread._local", "argparse.Namespace"]
missing-member-hint = true
missing-member-hint-distance = 1
missing-member-max-choices = 1

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["titans"]
known_third_party = ["jax", "flax", "optax", "numpy"]
# Google style import preferences
force_single_line = false
combine_as_imports = true
force_sort_within_sections = true
order_by_type = true
group_by_package = true

[tool.mypy]
# Google style type checking
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Additional Google preferences
strict_optional = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
warn_incomplete_stub = true

[[tool.mypy.overrides]]
module = ["jax.*", "flax.*", "optax.*", "orbax.*", "matplotlib.*", "seaborn.*", "wandb.*", "tqdm.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    ".benchmarks",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "venv",
    "htmlcov",
    ".coverage",
]

[tool.ruff.lint]
# Enhanced rule selection aligned with Google style
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "YTT", # flake8-2020
    "S",   # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "A",   # flake8-builtins
    "C90", # mccabe complexity
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific rules
    "D",   # pydocstyle (documentation)
]
ignore = [
    "E501",    # line too long, handled by formatter
    "B008",    # do not perform function calls in argument defaults
    "C901",    # too complex
    "B905",    # zip without explicit strict parameter
    "S101",    # use of assert detected
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR2004", # magic value used in comparison
    "FBT001",  # boolean typed positional argument
    "FBT002",  # boolean default positional argument
    "FBT003",  # boolean positional value in function call
    "A003",    # builtin attribute is shadowing
    "S301",    # pickle usage (we need it for serialization)
    "PTH123",  # open() usage (keeping for compatibility)
    "BLE001",  # blind except (some are intentional)
    "SLF001",  # private member access (needed for testing)
    "RUF001",  # unicode characters (used in documentation)
    "RUF002",  # unicode characters (used in documentation)
    "RUF003",  # unicode characters (used in documentation)
    "D100",    # missing docstring in public module
    "D101",    # missing docstring in public class
    "D102",    # missing docstring in public method
    "D103",    # missing docstring in public function
    "D104",    # missing docstring in public package
    "D105",    # missing docstring in magic method
    "D107",    # missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tests/*" = ["B011", "D100", "D101", "D102", "D103", "S101"]
"examples/*" = ["T20", "D100", "D101", "D102", "D103", "S112"]
"scripts/*" = ["T20", "D100", "D101", "D102", "D103", "S603", "PLC0415"]
"paper_reproduction/*" = ["T20", "D100", "D101", "D102", "D103", "S112"]
"titans/research_utilities.py" = ["S112"]

[tool.ruff.lint.isort]
known-first-party = ["titans"]
known-third-party = ["jax", "flax", "optax", "numpy", "scipy"]
force-single-line = false
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Use ruff formatter instead of pyink/black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pyright configuration
[tool.pyright]
# Basic configuration
pythonVersion = "3.11"
pythonPlatform = "Linux"
include = ["titans", "tests", "examples", "paper_reproduction"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/build",
    "**/dist",
    "**/venv",
    "**/htmlcov",
]

# Type checking settings - strict but practical
typeCheckingMode = "standard"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
strictParameterNoneValue = true
enableTypeIgnoreComments = true

# Report settings
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportImportCycles = "error"
reportUnusedImport = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportOptionalIterable = "warning"
reportOptionalContextManager = "warning"
reportOptionalOperand = "warning"
reportTypedDictNotRequiredAccess = "warning"
reportPrivateUsage = "warning"
reportConstantRedefinition = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportOverlappingOverloads = "error"
reportInvalidStringEscapeSequence = "error"
reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "information"       # Reduced from warning to information for JAX compatibility
reportMissingParameterType = "warning"
reportMissingTypeArgument = "warning"
reportInvalidTypeVarUse = "error"
reportCallInDefaultInitializer = "error"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportAssertAlwaysTrue = "warning"
reportSelfClsParameterName = "error"
reportImplicitStringConcatenation = "warning"
reportUndefinedVariable = "error"
reportUnboundVariable = "error"
reportInvalidStubStatement = "error"

# JAX-specific settings to reduce type checking noise
reportGeneralTypeIssues = "warning"
reportPartiallyUnknownType = "information" # This helps with JAX Array types
reportInconsistentConstructor = "warning"

# Additional stub search paths for better JAX type resolution
stubPath = "typings"

# Bandit security linter configuration
[tool.bandit]
exclude_dirs = ["tests", "test_*", "*_test.py"]
skips = [
    "B101", # Test for use of assert
    "B601", # paramiko calls
    "B602", # subprocess calls with shell=True
    "B603", # subprocess without shell equals true
]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]
