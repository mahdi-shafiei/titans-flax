name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.11"
  JAX_PLATFORMS: cpu

jobs:
  # Code quality checks
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting with Ruff
        run: ruff format --check titans/

      - name: Lint with Ruff
        run: ruff check titans/

      - name: Type checking with Pyright
        run: pyright titans/
        continue-on-error: true # Type checking can be strict, don't fail CI

  # Unit tests
  test:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Note: macOS runners require paid minutes, using ubuntu only for free tier
        os: [ubuntu-latest]
        # Match requires-python >= 3.11 from pyproject.toml
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with pytest
        run: |
          pytest tests/ \
            --cov=titans \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --tb=short

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Integration tests (longer running)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,research]"

      - name: Test complete example
        run: |
          python examples/titans_complete_example.py --mode quick

      - name: Test benchmarking
        run: |
          python -c "
          from titans.benchmark import TitansBenchmark
          benchmark = TitansBenchmark()
          results = benchmark.compare_variants(
              variants=['mac', 'lmm'],
              seq_len=64,
              batch_size=2,
              num_trials=2
          )
          print('Benchmark completed successfully')
          "

  # Performance benchmarks
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research]"

      - name: Run performance benchmarks
        run: |
          python -c "
          from titans.benchmark import TitansBenchmark
          import json

          benchmark = TitansBenchmark()
          results = benchmark.compare_variants(
              variants=['mac', 'mag', 'mal', 'lmm'],
              seq_len=128,
              batch_size=2,
              num_trials=3
          )

          # Save results as artifact
          with open('benchmark_results.json', 'w') as f:
              json.dump({
                  variant: metrics.get_summary()
                  for variant, metrics in results.items()
              }, f, indent=2)

          print('Performance benchmarks completed')
          "

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json

  # Documentation tests
  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Add documentation dependencies if needed
          # pip install sphinx sphinx-rtd-theme

      - name: Run doctests
        run: |
          echo "Running doctests..."
          pytest --doctest-modules titans/ -v --ignore=titans/__main__.py || true

      - name: Test README examples
        run: |
          # Extract and test code blocks from README
          python -c "
          import titans

          # Test basic import and creation
          model = titans.create_titans_model('mac', d_model=64, seed=42)
          print('README examples work correctly')
          "

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit security scan
        run: bandit -r titans/ -f sarif -o bandit-results.sarif || true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-results.sarif
        # Only upload on push events or PRs from the same repo (not forks)
        # continue-on-error prevents failure if code scanning isn't enabled
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true

  # Package building and testing
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Test installation
        run: |
          pip install dist/*.whl
          python -c "
          import titans
          model = titans.create_titans_model('mac', d_model=64, seed=42)
          print('Package installed successfully')
          "

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Release to PyPI (only on release)
  deploy:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    needs: [lint, test, integration, build]
    if: github.event_name == 'release' && github.event.action == 'published'

    environment:
      name: pypi
      url: https://pypi.org/p/titans-flax

    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Cleanup old artifacts
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: always()
    needs: [benchmark, build]

    steps:
      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          name: |
            benchmark-results
            dist
          failOnError: false
          useGlob: true

      - name: Clean up old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10

  # Workflow completion notification
  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [lint, test, integration, benchmark, docs, security, build]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Notify success
        if: ${{ needs.lint.result == 'success' && needs.test.result == 'success' }}
        run: |
          echo "✅ All checks passed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Notify failure
        if: ${{ needs.lint.result == 'failure' || needs.test.result == 'failure' }}
        run: |
          echo "❌ Some checks failed!"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Integration: ${{ needs.integration.result }}"
